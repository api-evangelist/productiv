naftiko: 1.0.0-alpha2
info:
  label: Productiv Developer API — Batch Upload
  description: 'Productiv Developer API — Batch Upload. 1 operations. Lead operation: Productiv Get Batch File Upload Urls.
    Self-contained Naftiko capability covering one Productiv business surface.'
  tags:
  - Productiv
  - Batch Upload
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRODUCTIV_API_KEY: PRODUCTIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: developer-batch-upload
    baseUri: https://public-api.productiv.com
    description: Productiv Developer API — Batch Upload business capability. Self-contained, no shared references.
    resources:
    - name: services-push-v1-customer-apps-appId-upload
      path: /services/push/v1/customer/apps/{appId}/upload
      operations:
      - name: getbatchuploadurls
        method: GET
        description: Productiv Get Batch File Upload Urls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          description: The unique identifier of the application.
          required: true
        - name: filenames
          in: query
          type: array
          description: The filenames to upload. Can be specified multiple times.
          required: true
    authentication:
      type: bearer
      token: '{{env.PRODUCTIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: developer-batch-upload-rest
    port: 8080
    description: REST adapter for Productiv Developer API — Batch Upload. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/services/push/v1/customer/apps/{appid}/upload
      name: services-push-v1-customer-apps-appid-upload
      description: REST surface for services-push-v1-customer-apps-appId-upload.
      operations:
      - method: GET
        name: getbatchuploadurls
        description: Productiv Get Batch File Upload Urls
        call: developer-batch-upload.getbatchuploadurls
        with:
          appId: rest.appId
          filenames: rest.filenames
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: developer-batch-upload-mcp
    port: 9090
    transport: http
    description: MCP adapter for Productiv Developer API — Batch Upload. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: productiv-get-batch-file-upload
      description: Productiv Get Batch File Upload Urls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: developer-batch-upload.getbatchuploadurls
      with:
        appId: tools.appId
        filenames: tools.filenames
      outputParameters:
      - type: object
        mapping: $.
