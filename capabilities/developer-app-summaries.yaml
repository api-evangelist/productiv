naftiko: 1.0.0-alpha2
info:
  label: Productiv Developer API — App Summaries
  description: 'Productiv Developer API — App Summaries. 1 operations. Lead operation: Productiv Get App Summaries. Self-contained
    Naftiko capability covering one Productiv business surface.'
  tags:
  - Productiv
  - App Summaries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRODUCTIV_API_KEY: PRODUCTIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: developer-app-summaries
    baseUri: https://public-api.productiv.com
    description: Productiv Developer API — App Summaries business capability. Self-contained, no shared references.
    resources:
    - name: services-export-v1-customer-app-summaries
      path: /services/export/v1/customer/app-summaries
      operations:
      - name: getappsummaries
        method: GET
        description: Productiv Get App Summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PRODUCTIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: developer-app-summaries-rest
    port: 8080
    description: REST adapter for Productiv Developer API — App Summaries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/services/export/v1/customer/app-summaries
      name: services-export-v1-customer-app-summaries
      description: REST surface for services-export-v1-customer-app-summaries.
      operations:
      - method: GET
        name: getappsummaries
        description: Productiv Get App Summaries
        call: developer-app-summaries.getappsummaries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: developer-app-summaries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Productiv Developer API — App Summaries. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: productiv-get-app-summaries
      description: Productiv Get App Summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: developer-app-summaries.getappsummaries
      outputParameters:
      - type: object
        mapping: $.
